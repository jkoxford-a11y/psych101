<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sleep architecture cycles across a typical night</title>
  <desc id="desc">A simplified eight-hour hypnogram shows repeated movement through wake, REM, and three NREM stages. Deep NREM 3 is concentrated in the first two cycles, while REM periods recur and lengthen toward morning. A lower summary states that sleep architecture shifts across the night, but biological functions overlap across stages and cycles.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eff5fb"/>
    </linearGradient>
    <linearGradient id="deep-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173f8a"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="rem-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#8b3aa6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 58px Arial, Helvetica, sans-serif; fill: #102a43; }
      .subtitle { font: 400 27px Arial, Helvetica, sans-serif; fill: #486581; }
      .stage { font: 700 25px Arial, Helvetica, sans-serif; fill: #243b53; }
      .stage-rem { font: 700 25px Arial, Helvetica, sans-serif; fill: #7e22a8; }
      .stage-deep { font: 700 25px Arial, Helvetica, sans-serif; fill: #173f8a; }
      .small { font: 400 20px Arial, Helvetica, sans-serif; fill: #486581; }
      .small-bold { font: 700 20px Arial, Helvetica, sans-serif; fill: #243b53; }
      .cycle { font: 700 20px Arial, Helvetica, sans-serif; fill: #334e68; }
      .axis { font: 700 22px Arial, Helvetica, sans-serif; fill: #243b53; }
      .card-kicker { font: 700 21px Arial, Helvetica, sans-serif; letter-spacing: 1px; }
      .card-title { font: 700 31px Arial, Helvetica, sans-serif; fill: #102a43; }
      .card-body { font: 400 22px Arial, Helvetica, sans-serif; fill: #334e68; }
      .takeaway { font: 700 30px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .takeaway-sub { font: 400 23px Arial, Helvetica, sans-serif; fill: #d9e2ec; }
      .grid { stroke: #d9e2ec; stroke-width: 2; }
      .divider { stroke: #9fb3c8; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#page)"/>

  <text class="title" x="800" y="72" text-anchor="middle">Sleep architecture cycles across the night</text>
  <text class="subtitle" x="800" y="116" text-anchor="middle">A typical simplified pattern: stages recur, but their proportions change from lights-out to morning.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="1460" height="500" rx="26" fill="#ffffff" stroke="#9fb3c8" stroke-width="2"/>
  </g>

  <!-- Stage bands -->
  <rect x="215" y="213" width="1285" height="70" fill="#f8fafc"/>
  <rect x="215" y="283" width="1285" height="70" fill="#faf5ff"/>
  <rect x="215" y="353" width="1285" height="70" fill="#f8fafc"/>
  <rect x="215" y="423" width="1285" height="70" fill="#f1f5f9"/>
  <rect x="215" y="493" width="1285" height="94" fill="#eff6ff"/>

  <g class="grid">
    <line x1="215" y1="248" x2="1500" y2="248"/>
    <line x1="215" y1="318" x2="1500" y2="318"/>
    <line x1="215" y1="388" x2="1500" y2="388"/>
    <line x1="215" y1="458" x2="1500" y2="458"/>
    <line x1="215" y1="540" x2="1500" y2="540"/>
  </g>

  <text class="stage" x="182" y="256" text-anchor="end">WAKE</text>
  <text class="stage-rem" x="182" y="326" text-anchor="end">REM</text>
  <text class="stage" x="182" y="396" text-anchor="end">NREM 1</text>
  <text class="stage" x="182" y="466" text-anchor="end">NREM 2</text>
  <text class="stage-deep" x="182" y="536" text-anchor="end">NREM 3</text>
  <text class="small" x="182" y="563" text-anchor="end">slow-wave sleep</text>

  <!-- Approximate cycle divisions -->
  <g class="divider">
    <line x1="535" y1="180" x2="535" y2="587"/>
    <line x1="785" y1="180" x2="785" y2="587"/>
    <line x1="1005" y1="180" x2="1005" y2="587"/>
    <line x1="1220" y1="180" x2="1220" y2="587"/>
  </g>
  <text class="cycle" x="375" y="192" text-anchor="middle">CYCLE 1 · about 90 min</text>
  <text class="cycle" x="660" y="192" text-anchor="middle">CYCLE 2</text>
  <text class="cycle" x="895" y="192" text-anchor="middle">CYCLE 3</text>
  <text class="cycle" x="1112" y="192" text-anchor="middle">CYCLE 4</text>
  <text class="cycle" x="1360" y="192" text-anchor="middle">CYCLE 5</text>

  <!-- Typical simplified hypnogram -->
  <path d="M230 248
           H260 V388
           H280 V458
           H310 V540
           H420 V458
           H455 V388
           H475 V318
           H535 V388
           H555 V458
           H590 V540
           H630 V458
           H680 V388
           H705 V318
           H785 V388
           H810 V458
           H850 V388
           H875 V318
           H980 V388
           H1005 V458
           H1050 V388
           H1075 V318
           H1195 V388
           H1220 V458
           H1260 V388
           H1285 V318
           H1435 V388
           H1460 V248
           H1490"
        fill="none" stroke="#102a43" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Colored stage emphasis -->
  <g fill="none" stroke-linecap="round">
    <path d="M310 540 H420 M590 540 H630" stroke="#173f8a" stroke-width="16"/>
    <path d="M475 318 H535 M705 318 H785 M875 318 H980 M1075 318 H1195 M1285 318 H1435" stroke="#8b3aa6" stroke-width="16"/>
  </g>

  <text class="small-bold" x="365" y="575" text-anchor="middle" fill="#173f8a">more deep NREM early</text>
  <text class="small-bold" x="1360" y="300" text-anchor="middle" fill="#7e22a8">longer REM periods later</text>

  <!-- Time axis -->
  <line x1="230" y1="610" x2="1490" y2="610" stroke="#102a43" stroke-width="3"/>
  <g stroke="#102a43" stroke-width="3">
    <line x1="230" y1="602" x2="230" y2="620"/>
    <line x1="545" y1="602" x2="545" y2="620"/>
    <line x1="860" y1="602" x2="860" y2="620"/>
    <line x1="1175" y1="602" x2="1175" y2="620"/>
    <line x1="1490" y1="602" x2="1490" y2="620"/>
  </g>
  <text class="axis" x="230" y="642" text-anchor="middle">lights out</text>
  <text class="axis" x="545" y="642" text-anchor="middle">2 hours</text>
  <text class="axis" x="860" y="642" text-anchor="middle">4 hours</text>
  <text class="axis" x="1175" y="642" text-anchor="middle">6 hours</text>
  <text class="axis" x="1490" y="642" text-anchor="middle">8 hours</text>

  <!-- Architecture observations, not function-by-time assignments -->
  <g filter="url(#shadow)">
    <rect x="70" y="685" width="455" height="135" rx="22" fill="#f5f9ff" stroke="#b2ccff" stroke-width="2"/>
    <rect x="572" y="685" width="455" height="135" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1075" y="685" width="455" height="135" rx="22" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  </g>

  <text class="card-kicker" x="100" y="723" fill="#175cd3">EARLIER NIGHT</text>
  <text class="card-title" x="100" y="760">More NREM 3</text>
  <text class="card-body" x="100" y="794">Slow-wave sleep is concentrated earlier.</text>

  <text class="card-kicker" x="602" y="723" fill="#475467">EVERY CYCLE</text>
  <text class="card-title" x="602" y="760">Stages recur</text>
  <text class="card-body" x="602" y="794">NREM and REM return across the night.</text>

  <text class="card-kicker" x="1105" y="723" fill="#7e22a8">TOWARD MORNING</text>
  <text class="card-title" x="1105" y="760">Longer REM periods</text>
  <text class="card-body" x="1105" y="794">REM occupies more of later cycles.</text>

  <rect x="125" y="855" width="1350" height="105" rx="28" fill="#102a43"/>
  <text class="takeaway" x="800" y="900" text-anchor="middle">ARCHITECTURE SHIFTS; FUNCTIONS OVERLAP</text>
  <text class="takeaway-sub" x="800" y="936" text-anchor="middle">Restoration, memory reorganization, and regulation are not owned by one clock block or a single stage.</text>

  <text class="small" x="800" y="990" text-anchor="middle">Typical teaching pattern—not every person’s exact night. Cycle timing and stage proportions vary.</text>
</svg>
