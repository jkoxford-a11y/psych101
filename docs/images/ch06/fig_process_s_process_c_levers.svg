<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Two processes, two different signals</title>
  <desc id="desc">Two aligned graphs use separate vertical scales. Process S is sleep pressure: it rises during wakefulness and falls during sleep. Process C is circadian alerting: it rises and falls with biological time. Caffeine and naps act on Process S, while morning light, melatonin, and evening light act on circadian timing. High sleep pressure pushes toward sleep, while high circadian alerting supports wakefulness.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#15324a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="wakeBg" x1="0" x2="1">
      <stop offset="0" stop-color="#fff8dd"/>
      <stop offset="1" stop-color="#fffdf5"/>
    </linearGradient>
    <linearGradient id="sleepBg" x1="0" x2="1">
      <stop offset="0" stop-color="#e5eef9"/>
      <stop offset="1" stop-color="#ccdff3"/>
    </linearGradient>
    <style>
      .sans { font-family: Aptos, Arial, sans-serif; }
      .ink { fill: #183247; }
      .muted { fill: #526879; }
      .navy { fill: #123f73; }
      .green { fill: #246b3d; }
      .blue { fill: #1769aa; }
      .panel { fill: #ffffff; stroke: #adc1d2; stroke-width: 2.5; }
      .axis { stroke: #657989; stroke-width: 2.5; }
      .grid { stroke: #d7e1e9; stroke-width: 2; stroke-dasharray: 7 8; }
      .tick { font-family: Aptos, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #415769; text-anchor: middle; }
      .cardTitle { font-family: Aptos, Arial, sans-serif; font-size: 23px; font-weight: 800; }
      .cardText { font-family: Aptos, Arial, sans-serif; font-size: 19px; fill: #294255; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f6f9fc"/>
  <text x="800" y="60" class="sans navy" font-size="46" font-weight="800" text-anchor="middle">Two processes, two different signals</text>
  <text x="800" y="101" class="sans muted" font-size="26" text-anchor="middle">Process S tracks sleep pressure. Process C tracks circadian alerting.</text>

  <!-- Shared time bands -->
  <rect x="260" y="152" width="847" height="684" fill="url(#wakeBg)"/>
  <rect x="1107" y="152" width="363" height="684" fill="url(#sleepBg)"/>
  <text x="684" y="181" class="sans" font-size="20" font-weight="800" fill="#8b6813" text-anchor="middle">TYPICAL WAKE PERIOD</text>
  <text x="1288" y="181" class="sans" font-size="20" font-weight="800" fill="#315b7d" text-anchor="middle">TYPICAL SLEEP PERIOD</text>

  <!-- Process S panel -->
  <g filter="url(#shadow)">
    <rect x="70" y="202" width="1460" height="300" rx="22" class="panel"/>
  </g>
  <rect x="70" y="202" width="170" height="300" rx="22" fill="#eaf5ed"/>
  <path d="M218 202 H92 A22 22 0 0 0 70 224 V480 A22 22 0 0 0 92 502 H218 Z" fill="#eaf5ed"/>
  <rect x="260" y="204" width="847" height="296" fill="url(#wakeBg)"/>
  <rect x="1107" y="204" width="363" height="296" fill="url(#sleepBg)"/>
  <text x="145" y="271" class="sans green" font-size="31" font-weight="900" text-anchor="middle">PROCESS S</text>
  <text x="145" y="309" class="sans ink" font-size="23" font-weight="700" text-anchor="middle">Sleep pressure</text>
  <line x1="127" y1="430" x2="127" y2="346" stroke="#596d7d" stroke-width="3"/>
  <text x="145" y="338" class="sans green" font-size="19" font-weight="800" text-anchor="middle">HIGH</text>
  <text x="145" y="465" class="sans muted" font-size="19" font-weight="800" text-anchor="middle">LOW</text>

  <line x1="260" y1="460" x2="1470" y2="460" class="axis"/>
  <line x1="260" y1="247" x2="1470" y2="247" class="grid"/>
  <line x1="1107" y1="202" x2="1107" y2="502" stroke="#6b86a0" stroke-width="2.5" stroke-dasharray="8 8"/>
  <path d="M260 439 C520 426 805 342 1107 265 C1172 332 1270 405 1470 432" fill="none" stroke="#287342" stroke-width="9" stroke-linecap="round"/>
  <circle cx="260" cy="439" r="8" fill="#287342"/>
  <circle cx="1107" cy="265" r="8" fill="#287342"/>
  <circle cx="1470" cy="432" r="8" fill="#287342"/>
  <text x="560" y="260" class="sans green" font-size="23" font-weight="800">BUILDS WHILE AWAKE</text>
  <text x="1320" y="245" class="sans green" font-size="23" font-weight="800" text-anchor="middle">FALLS DURING SLEEP</text>
  <text x="560" y="290" class="sans muted" font-size="19">More time awake → stronger pressure to sleep</text>
  <text x="1320" y="275" class="sans muted" font-size="19" text-anchor="middle">Sleep discharges accumulated pressure</text>

  <!-- Process C panel -->
  <g filter="url(#shadow)">
    <rect x="70" y="536" width="1460" height="300" rx="22" class="panel"/>
  </g>
  <rect x="70" y="536" width="170" height="300" rx="22" fill="#e8f1fa"/>
  <path d="M218 536 H92 A22 22 0 0 0 70 558 V814 A22 22 0 0 0 92 836 H218 Z" fill="#e8f1fa"/>
  <rect x="260" y="538" width="847" height="296" fill="url(#wakeBg)"/>
  <rect x="1107" y="538" width="363" height="296" fill="url(#sleepBg)"/>
  <text x="145" y="605" class="sans blue" font-size="31" font-weight="900" text-anchor="middle">PROCESS C</text>
  <text x="145" y="643" class="sans ink" font-size="22" font-weight="700" text-anchor="middle">Circadian</text>
  <text x="145" y="671" class="sans ink" font-size="22" font-weight="700" text-anchor="middle">alerting</text>
  <line x1="127" y1="766" x2="127" y2="695" stroke="#596d7d" stroke-width="3"/>
  <text x="145" y="690" class="sans blue" font-size="19" font-weight="800" text-anchor="middle">HIGH</text>
  <text x="145" y="802" class="sans muted" font-size="19" font-weight="800" text-anchor="middle">LOW</text>

  <line x1="260" y1="794" x2="1470" y2="794" class="axis"/>
  <line x1="260" y1="581" x2="1470" y2="581" class="grid"/>
  <line x1="1107" y1="536" x2="1107" y2="836" stroke="#6b86a0" stroke-width="2.5" stroke-dasharray="8 8"/>
  <path d="M260 742 C450 660 720 584 945 615 C1085 635 1162 733 1290 777 C1360 797 1412 773 1470 733" fill="none" stroke="#1769aa" stroke-width="9" stroke-linecap="round"/>
  <circle cx="260" cy="742" r="8" fill="#1769aa"/>
  <circle cx="945" cy="615" r="8" fill="#1769aa"/>
  <circle cx="1290" cy="777" r="8" fill="#1769aa"/>
  <text x="620" y="690" class="sans blue" font-size="22" font-weight="800">SCN-TIMED ALERTING RISES</text>
  <text x="1240" y="610" class="sans blue" font-size="22" font-weight="800" text-anchor="middle">ALERTING FALLS AT BIOLOGICAL NIGHT</text>
  <text x="620" y="720" class="sans muted" font-size="19">Helps oppose mounting sleep pressure late in the day</text>
  <text x="1240" y="640" class="sans muted" font-size="19" text-anchor="middle">Lower alerting makes sleep easier</text>

  <!-- Time axis -->
  <g>
    <line x1="260" y1="850" x2="1470" y2="850" class="axis"/>
    <g class="tick">
      <line x1="260" y1="842" x2="260" y2="860" class="axis"/><text x="260" y="888">6 AM</text>
      <line x1="563" y1="842" x2="563" y2="860" class="axis"/><text x="563" y="888">12 PM</text>
      <line x1="865" y1="842" x2="865" y2="860" class="axis"/><text x="865" y="888">6 PM</text>
      <line x1="1168" y1="842" x2="1168" y2="860" class="axis"/><text x="1168" y="888">12 AM</text>
      <line x1="1470" y1="842" x2="1470" y2="860" class="axis"/><text x="1470" y="888">6 AM</text>
    </g>
  </g>

  <!-- Practical levers -->
  <text x="800" y="930" class="sans navy" font-size="28" font-weight="900" text-anchor="middle">Practical levers act on different processes</text>
  <g>
    <rect x="82" y="955" width="276" height="112" rx="16" fill="#f4effa" stroke="#7952a4" stroke-width="2.5"/>
    <text x="105" y="990" class="cardTitle" fill="#694293">CAFFEINE · S</text>
    <text x="105" y="1023" class="cardText">Masks the pressure signal;</text>
    <text x="105" y="1049" class="cardText">does not discharge it.</text>

    <rect x="372" y="955" width="254" height="112" rx="16" fill="#fff1e8" stroke="#cf6b2c" stroke-width="2.5"/>
    <text x="395" y="990" class="cardTitle" fill="#bd581b">NAP · S</text>
    <text x="395" y="1023" class="cardText">Can discharge some</text>
    <text x="395" y="1049" class="cardText">accumulated pressure.</text>

    <rect x="640" y="955" width="276" height="112" rx="16" fill="#eaf3fb" stroke="#397db1" stroke-width="2.5"/>
    <text x="663" y="990" class="cardTitle" fill="#1769aa">MORNING LIGHT · C</text>
    <text x="663" y="1023" class="cardText">Entrains timing and can</text>
    <text x="663" y="1049" class="cardText">shift the clock earlier.</text>

    <rect x="930" y="955" width="258" height="112" rx="16" fill="#eef6e8" stroke="#638b38" stroke-width="2.5"/>
    <text x="953" y="990" class="cardTitle" fill="#4e7625">MELATONIN · C</text>
    <text x="953" y="1023" class="cardText">Signals biological night;</text>
    <text x="953" y="1049" class="cardText">not a general knockout.</text>

    <rect x="1202" y="955" width="316" height="112" rx="16" fill="#fff0f0" stroke="#c94b4b" stroke-width="2.5"/>
    <text x="1225" y="990" class="cardTitle" fill="#b63636">EVENING LIGHT · C</text>
    <text x="1225" y="1023" class="cardText">Can delay circadian timing</text>
    <text x="1225" y="1049" class="cardText">and make sleep harder.</text>
  </g>

  <rect x="150" y="1097" width="1300" height="72" rx="20" fill="#123f73"/>
  <text x="800" y="1127" class="sans" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">High S pushes toward sleep. High C pushes toward wakefulness.</text>
  <text x="800" y="1156" class="sans" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">Sleep becomes easier when pressure is high and circadian alerting falls.</text>
</svg>
