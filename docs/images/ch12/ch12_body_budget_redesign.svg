<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Body budget deposits and withdrawals</title>
  <desc id="desc">Eating, sleeping, and supportive social contact replenish the body’s metabolic resources. Moving, learning, fighting infection, coping with uncertainty, and meeting threats draw on them. When withdrawals outpace recovery, a metabolic deficit can contribute to unpleasant affect.</desc>
  <defs>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2f6f49"/></marker>
    <marker id="arrowRust" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#a9472b"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#315b8a"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#fbfcfe"/>
  <text x="800" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#17365d">BODY BUDGET: DEPOSITS AND WITHDRAWALS</text>
  <text x="800" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#475569">The brain anticipates needs and coordinates the body’s metabolic resources.</text>

  <!-- Deposits -->
  <rect x="70" y="165" width="470" height="500" rx="26" fill="#edf7f0" stroke="#2f6f49" stroke-width="4"/>
  <circle cx="135" cy="220" r="29" fill="#2f6f49"/>
  <path d="M120 220 H150 M135 205 V235" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <text x="185" y="231" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#215b3b">DEPOSITS</text>
  <text x="305" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#3d5c48">replenish metabolic resources</text>

  <g font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#17365d">
    <rect x="120" y="315" width="370" height="78" rx="16" fill="#ffffff" stroke="#7da88b" stroke-width="3"/>
    <text x="305" y="365" text-anchor="middle">Eating</text>
    <rect x="120" y="420" width="370" height="78" rx="16" fill="#ffffff" stroke="#7da88b" stroke-width="3"/>
    <text x="305" y="470" text-anchor="middle">Sleeping</text>
    <rect x="120" y="525" width="370" height="92" rx="16" fill="#ffffff" stroke="#7da88b" stroke-width="3"/>
    <text x="305" y="562" text-anchor="middle">Supportive</text>
    <text x="305" y="596" text-anchor="middle">social contact</text>
  </g>

  <!-- Central regulation -->
  <rect x="650" y="205" width="300" height="420" rx="30" fill="#eaf1fb" stroke="#315b8a" stroke-width="5"/>
  <circle cx="800" cy="295" r="48" fill="#ffffff" stroke="#315b8a" stroke-width="4"/>
  <circle cx="800" cy="275" r="14" fill="#315b8a"/>
  <path d="M800 292 V325 M770 308 H830 M782 355 L800 325 L818 355" stroke="#315b8a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#17365d">PRESENT</text>
  <text x="800" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#17365d">BODILY</text>
  <text x="800" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#17365d">CONDITION</text>
  <line x1="700" y1="515" x2="900" y2="515" stroke="#9cb2cc" stroke-width="3"/>
  <text x="800" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">What does the body need now?</text>
  <text x="800" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">What will it need next?</text>

  <!-- Withdrawals -->
  <rect x="1060" y="165" width="470" height="500" rx="26" fill="#fff3ed" stroke="#a9472b" stroke-width="4"/>
  <circle cx="1125" cy="220" r="29" fill="#a9472b"/>
  <path d="M1110 220 H1140" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <text x="1175" y="231" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#8c351f">WITHDRAWALS</text>
  <text x="1295" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#6b4b42">draw on metabolic resources</text>

  <g font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#17365d">
    <rect x="1110" y="300" width="370" height="58" rx="14" fill="#ffffff" stroke="#c98b78" stroke-width="3"/><text x="1295" y="339" text-anchor="middle">Moving</text>
    <rect x="1110" y="373" width="370" height="58" rx="14" fill="#ffffff" stroke="#c98b78" stroke-width="3"/><text x="1295" y="412" text-anchor="middle">Learning</text>
    <rect x="1110" y="446" width="370" height="58" rx="14" fill="#ffffff" stroke="#c98b78" stroke-width="3"/><text x="1295" y="485" text-anchor="middle">Fighting infection</text>
    <rect x="1110" y="519" width="370" height="58" rx="14" fill="#ffffff" stroke="#c98b78" stroke-width="3"/><text x="1295" y="558" text-anchor="middle">Coping with uncertainty</text>
    <rect x="1110" y="592" width="370" height="58" rx="14" fill="#ffffff" stroke="#c98b78" stroke-width="3"/><text x="1295" y="631" text-anchor="middle">Meeting threats</text>
  </g>

  <!-- Direction arrows -->
  <text x="590" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f6f49">REPLENISH</text>
  <path d="M555 405 H625" stroke="#2f6f49" stroke-width="7" marker-end="url(#arrowGreen)"/>
  <text x="1010" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a9472b">DRAW ON</text>
  <path d="M975 405 H1045" stroke="#a9472b" stroke-width="7" marker-end="url(#arrowRust)"/>

  <!-- Teaching payoff -->
  <rect x="120" y="720" width="1360" height="130" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="310" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17365d">DEMANDS OUTPACE RECOVERY</text>
  <path d="M500 770 H610" stroke="#315b8a" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <text x="800" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17365d">METABOLIC DEFICIT</text>
  <path d="M990 770 H1100" stroke="#315b8a" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <text x="1300" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17365d">UNPLEASANT AFFECT</text>
  <text x="800" y="822" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#475569">You can feel bad before context tells you whether the moment is dread, irritation, fatigue, or something else.</text>
</svg>
