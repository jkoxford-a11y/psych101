  <text id="svg_91" font-family="Aptos, Arial, sans-serif" text-anchor="middle" fill="#ffffff" font-weight="850" font-size="25" class="sans" y="870" x="800">Model predicts → evidence tests → error corrects → updated model predicts again</text>
  <text id="svg_92" font-family="Aptos, Arial, sans-serif" text-anchor="middle" fill="#dbeafa" font-size="23" class="sans" y="910" x="800">The same updated model helps construct perception and guide action.</text>
  <text id="svg_93" font-family="Aptos, Arial, sans-serif" text-anchor="middle" fill="#dbeafa" font-size="23" class="sans" y="946" x="800">Action then creates the next round of sensory evidence.</text>
