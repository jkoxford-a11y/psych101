<svg width="1600" height="1050" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
 <title id="title">Prediction error updates the model</title>
 <desc id="desc">A prediction loop with seven connected parts. The world supplies partial sensory evidence. Evidence and a top-down prediction from the current model meet at a comparison step. Residual mismatch becomes prediction error, which flows into an explicit update-the-model step. The updated model generates the next prediction and guides perception and action. Action samples or changes the world, producing new sensory evidence.</desc>
 <defs>
  <filter height="140%" width="140%" y="-20%" x="-20%" id="shadow"/>
  <marker markerUnits="userSpaceOnUse" orient="auto" refY="12" refX="22" markerHeight="24" markerWidth="24" id="blueArrow">
   <path id="svg_1" fill="#1f67a7" d="m0,0l24,12l-24,12l0,-24z"/>
  </marker>
  <marker markerUnits="userSpaceOnUse" orient="auto" refY="12" refX="22" markerHeight="24" markerWidth="24" id="greenArrow">
   <path id="svg_2" fill="#267044" d="m0,0l24,12l-24,12l0,-24z"/>
  </marker>
  <marker markerUnits="userSpaceOnUse" orient="auto" refY="12" refX="22" markerHeight="24" markerWidth="24" id="purpleArrow">
   <path id="svg_3" fill="#6b4aa1" d="m0,0l24,12l-24,12l0,-24z"/>
  </marker>
  <marker markerUnits="userSpaceOnUse" orient="auto" refY="12" refX="22" markerHeight="24" markerWidth="24" id="navyArrow">
   <path id="svg_4" fill="#16477a" d="m0,0l24,12l-24,12l0,-24z"/>
  </marker>
 </defs>
